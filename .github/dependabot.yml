version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/crates/muten-overlay"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    allow:
      - dependency-type: "direct"
    automerge:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
