[package]
name        = "muten-audio"
description = "muten — forced-mute policy engine for managed Windows PCs (pure logic + CLI; OS audio control lives in a PowerShell helper)"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
rust-version = "1.75.0"
repository   = "https://github.com/shizukutanaka/muten"
readme       = "README.md"
keywords     = ["mute", "audio", "endpoint", "policy", "kiosk"]
categories   = ["command-line-utilities", "os"]

[lints.rust]
unsafe_code = "forbid"

# The `cli` feature gates the binary (requires clap). It is on by default
# so that `cargo build` produces the agent binary. Library-only consumers
# can opt out with `default-features = false`.
[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "muten-audio"
path = "src/bin/cli.rs"
required-features = ["cli"]

[dependencies]
serde      = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror  = "=2.0.20"
clap       = { version = "=4.6.6", features = ["derive"], optional = true }
sha2 = "=0.11.0"
hex = "=0.4.3"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"

# Gate the CLI integration tests on the cli feature so that
# `cargo test --no-default-features` doesn't fail for a missing binary.
[[test]]
name = "cli_contract"
required-features = ["cli"]
