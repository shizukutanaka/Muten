[package]
name = "muten-overlay-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.muten-overlay]
path = ".."
default-features = false  # skip clap/CLI

[[bin]]
name = "fuzz_ruleset_parse"
path = "fuzz_targets/fuzz_ruleset_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_classify"
path = "fuzz_targets/fuzz_classify.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verify_chain"
path = "fuzz_targets/fuzz_verify_chain.rs"
test = false
doc = false

[[bin]]
name = "fuzz_window_json"
path = "fuzz_targets/fuzz_window_json.rs"
test = false
doc = false

# cargo-fuzz requires nightly and the following profile settings.
[profile.release]
debug = true

[profile.dev]
opt-level = 3  # keep assertions fast
