# Ready-to-install workflow: builds muten-audio.exe on Windows and
# uploads it as a build artifact, so deployments never need a local
# Rust toolchain.
#
# TO INSTALL: copy this file to .github/workflows/build-windows.yml
# (the automated GitHub App cannot push workflow files; a repository
# owner must do this once - same situation as docs/ci/ci.yml).
#
# After it runs, download the "muten-audio-windows" artifact and put
# muten-audio.exe into the agent/ folder next to Start-Muten.bat.

name: build-windows

on:
  push:
    paths:
      - "crates/muten-audio/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/muten-audio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release exe
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: muten-audio-windows
          path: crates/muten-audio/target/release/muten-audio.exe
